name: ScienceBreak
options:
  bundleIdPrefix: studio.soundscience
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    TARGETED_DEVICE_FAMILY: '1'
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIBackgroundModes: [audio]
    INFOPLIST_KEY_CFBundleDisplayName: Sound Science
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.news
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    DEVELOPMENT_TEAM: 8K5ZVPCQ42
    CODE_SIGN_STYLE: Automatic
packages:
  RiveRuntime:
    url: https://github.com/rive-app/rive-ios
    from: 6.27.0
targets:
  ScienceBreak:
    type: application
    platform: iOS
    sources: [ScienceBreak]
    dependencies:
      - package: RiveRuntime
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.soundscience.app
schemes:
  ScienceBreak:
    build:
      targets:
        ScienceBreak: all
