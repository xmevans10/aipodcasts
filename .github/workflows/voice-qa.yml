name: voice-qa

# Private, on-demand listening artifacts. No feed writes or public uploads.
on:
  workflow_dispatch:
    inputs:
      batch_run_id:
        description: Reviewed full-run ID for three full episodes (blank for character comparisons)
        default: ''

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      BATCH_RUN_ID: ${{ inputs.batch_run_id }}
      LILT_REVIEWER: openai
      GOOGLE_CLOUD_PROJECT: zwicky-509510
      GOOGLE_CLOUD_REGION: eu
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          project_id: zwicky-509510
          workload_identity_provider: projects/963729700523/locations/global/workloadIdentityPools/github-actions/providers/sciencebreak-main
          service_account: zwicky-406@zwicky-509510.iam.gserviceaccount.com
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install narration dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y espeak-ng ffmpeg
          python3 -m pip install numpy 'google-cloud-texttospeech>=2.31.0'
      - name: Render character comparisons
        if: env.BATCH_RUN_ID == ''
        run: python3 tools/tts/performance_previews.py --out voice-qa
      - name: Download and validate reviewed scripts
        if: env.BATCH_RUN_ID != ''
        run: |
          [[ "$BATCH_RUN_ID" =~ ^[0-9]+$ ]] || exit 1
          gh run download "$BATCH_RUN_ID" --repo "$GITHUB_REPOSITORY" --name full-run-transcripts --dir reviewed-batch
          python3 experiments/full-run/check_batch.py reviewed-batch --allow-partial
          python3 tools/tts/select_voice_qa.py reviewed-batch qa-transcripts
      - name: Render three full QA episodes
        if: env.BATCH_RUN_ID != ''
        run: |
          python3 tools/tts/bundle_shows.py --transcripts qa-transcripts --out voice-qa --tts-provider google-cloud
          python3 tools/tts/estimate_cost.py --episodes voice-qa --out voice-qa/cost-estimate.json
      - name: Save private listening artifacts
        uses: actions/upload-artifact@v4
        with:
          name: voice-qa-${{ github.run_id }}
          path: |
            voice-qa/
            qa-transcripts/
          retention-days: 7
