name: Zwicky
options:
  bundleIdPrefix: com.xmevans10
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    TARGETED_DEVICE_FAMILY: '1'
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    INFOPLIST_KEY_CFBundleDisplayName: Zwicky
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.news
    INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false
    CURRENT_PROJECT_VERSION: 3
    MARKETING_VERSION: 1.0.0
    DEVELOPMENT_TEAM: 8K5ZVPCQ42
    CODE_SIGN_STYLE: Automatic
targets:
  Zwicky:
    type: application
    platform: iOS
    sources: [Zwicky]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xmevans10.Zwicky
        INFOPLIST_FILE: Zwicky-Info.plist
schemes:
  Zwicky:
    build:
      targets:
        Zwicky: all
