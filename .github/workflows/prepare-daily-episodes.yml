name: prepare-daily-episodes

# Three attempts before the morning release. Later attempts reuse today's artifact.
on:
  schedule:
    - cron: "17 2,3,4 * * *"
      timezone: "America/New_York"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: prepare-daily-episodes-v1
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      HF_HOME: ${{ github.workspace }}/.hf
      PYTHONUNBUFFERED: "1"
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}
      R2_PREFIX: v1
      GOOGLE_CLOUD_PROJECT: zwicky-509510
      GOOGLE_CLOUD_REGION: eu
    steps:
      - uses: actions/checkout@v4

      - name: Set Eastern publication date
        run: echo "RELEASE_DATE=$(TZ=America/New_York date +%F)" >> "$GITHUB_ENV"

      - name: Check for today's prepared artifact
        id: existing
        run: |
          artifact=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.name == \"prepared-episodes-$RELEASE_DATE\" and .expired == false) | .id")
          if [ -n "$artifact" ]; then
            echo "Today's audio is already prepared (artifact $artifact)"
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          fi

      - if: steps.existing.outputs.skip != 'true'
        uses: google-github-actions/auth@v3
        with:
          project_id: zwicky-509510
          workload_identity_provider: projects/963729700523/locations/global/workloadIdentityPools/github-actions/providers/sciencebreak-main
          service_account: zwicky-406@zwicky-509510.iam.gserviceaccount.com

      - if: steps.existing.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Select, render, and measure today's episodes
        if: steps.existing.outputs.skip != 'true'
        run: bash scripts/prepare-daily-episodes.sh "$RELEASE_DATE" .

      - name: Save prepared release
        if: steps.existing.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: prepared-episodes-${{ env.RELEASE_DATE }}
          path: |
            release-date.txt
            release-count.txt
            daily-transcripts/
            daily-episodes/
            cost-estimate.json
          retention-days: 7
