name: publish-share-pages

# Backfill browser listening pages for the existing catalog. New daily releases
# publish their pages in tools/publish_feed.py before updating feed.json.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: Publish listening pages and update share URLs in the app feed
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: publish-share-pages-v1
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}
      R2_PREFIX: v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 -m pip install boto3
      - name: Inspect existing catalog and share pages
        run: python3 tools/publish_feed.py --share-pages-only --dry-run
      - name: Publish pages before the updated feed
        if: ${{ inputs.apply }}
        run: python3 tools/publish_feed.py --share-pages-only
