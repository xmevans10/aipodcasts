name: daily-episodes

# Prepare at 02:17 Eastern, start this job at 07:43, publish at 08:00.
# GitHub scheduled starts can be delayed; a late job publishes immediately.
on:
  schedule:
    - cron: "43 7 * * *"
      timezone: "America/New_York"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: daily-episodes-v1
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}
      R2_PREFIX: v1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install R2 client
        run: python3 -m pip install boto3

      - name: Set Eastern publication date
        run: echo "RELEASE_DATE=$(TZ=America/New_York date +%F)" >> "$GITHUB_ENV"

      - name: Download today's prepared release
        id: prepared
        run: |
          found=0
          for run_id in $(gh run list --workflow prepare-daily-episodes.yml \
            --status completed --limit 20 --json databaseId,conclusion \
            --jq '.[] | select(.conclusion == "success") | .databaseId'); do
            if gh run download "$run_id" \
              --name "prepared-episodes-$RELEASE_DATE" --dir prepared; then
              found=1
              break
            fi
            rm -rf prepared
          done
          if [ "$found" -ne 1 ]; then
            echo "No successful overnight render for $RELEASE_DATE" >&2
            exit 1
          fi
          test "$(cat prepared/release-date.txt)" = "$RELEASE_DATE"
          count=$(cat prepared/release-count.txt)
          case "$count" in 0|1|2) ;; *) echo "Invalid prepared episode count: $count" >&2; exit 1 ;; esac
          if [ "$count" -gt 0 ]; then
            test "$(find prepared/daily-episodes -maxdepth 1 -name '*.m4a' | wc -l | tr -d ' ')" = "$count"
            test "$(find prepared/daily-episodes -maxdepth 1 -name '*.json' ! -name index.json | wc -l | tr -d ' ')" = "$count"
          fi
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Wait until 08:00 Eastern
        if: steps.prepared.outputs.count != '0'
        run: |
          python3 - <<'PY'
          from datetime import datetime
          from time import sleep
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo("America/New_York"))
          target = now.replace(hour=8, minute=0, second=0, microsecond=0)
          seconds = max(0, (target - now).total_seconds())
          print(f"Publishing at 08:00 Eastern; waiting {seconds:.0f} seconds", flush=True)
          sleep(seconds)
          PY

      - name: Append to R2 feed
        if: steps.prepared.outputs.count != '0'
        run: |
          python3 tools/publish_feed.py --episodes prepared/daily-episodes \
            --merge-existing --max-per-day 2

      - name: Verify episodes through the app feed URL
        if: steps.prepared.outputs.count != '0'
        run: |
          python3 tools/verify_daily_feed.py \
            --transcripts prepared/daily-transcripts --date "$RELEASE_DATE"
