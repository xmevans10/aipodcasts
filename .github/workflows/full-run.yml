name: full-run-transcripts

# Draft and review all sixteen shows. A dispatch can resume from the approved
# scripts in a committed batch or a prior Actions artifact. Incomplete runs upload
# their manifest and withheld drafts but cannot start rendering or publishing.
on:
  schedule:
    - cron: "0 13 * * 1"   # Mondays, 13:00 UTC
  workflow_dispatch:
    inputs:
      days:
        description: Selection window in days
        default: "14"
      per_show:
        description: Candidates considered per show
        default: "3"
      seed_dir:
        description: Committed batch to resume (optional)
        default: ""
      seed_run_id:
        description: Prior full-run Actions run ID to resume (optional; overrides seed_dir)
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: full-run-${{ github.ref }}
  cancel-in-progress: false

jobs:
  transcripts:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.6-luna' }}
      OPENAI_REASONING_EFFORT: ${{ vars.OPENAI_REASONING_EFFORT || 'low' }}
      LILT_OPENALEX_KEY: ${{ secrets.LILT_OPENALEX_KEY }}
      LILT_CONTACT_EMAIL: ${{ secrets.LILT_CONTACT_EMAIL }}
      CORE_API_KEY: ${{ secrets.CORE_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      TYPESAFE_AI_API_KEY: ${{ secrets.TYPESAFE_AI_API_KEY }}
      LILT_EUREKALERT: "1"
      LILT_SMC: "1"
      LILT_DRAFT_ATTEMPTS: "2"
      # The weekly run drafts every show, so the per-run cap must exceed the show count.
      LILT_MAX_PROVIDER_CALLS_PER_DAY: "96"
      SEED_DIR: ${{ inputs.seed_dir || '' }}
      SEED_RUN_ID: ${{ inputs.seed_run_id || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resume from prior Actions run
        if: env.SEED_RUN_ID != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$SEED_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name full-run-transcripts --dir seed-artifacts
          echo "SEED_DIR=seed-artifacts" >> "$GITHUB_ENV"

      - name: Generate one transcript per show
        run: |
          python3 experiments/full-run/run_all_shows.py \
            --days "$DAYS" \
            --per-show "$PER_SHOW" \
            --seed-dir "$SEED_DIR" \
            --out full-run-artifacts
        env:
          DAYS: ${{ inputs.days || '14' }}
          PER_SHOW: ${{ inputs.per_show || '3' }}

      - name: Upload reviewed and withheld transcripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-run-transcripts
          path: full-run-artifacts/
          if-no-files-found: warn
          retention-days: 90

      - name: Require sixteen current factual and audience approvals
        run: python3 experiments/full-run/check_batch.py full-run-artifacts

  # Turn the weekly transcripts into app-ready episodes with the free Kokoro cast
  # (Apache-2.0, one distinct voice per host). Co-hosted dialogue is spliced by turn.
  # No key, no cloning.
  episodes:
    needs: transcripts
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HF_HOME: ${{ github.workspace }}/.hf
      PYTHONUNBUFFERED: "1"
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}
      R2_PREFIX: v1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download transcripts
        uses: actions/download-artifact@v4
        with:
          name: full-run-transcripts
          path: full-run-artifacts

      - name: Recheck release gate before rendering
        run: python3 experiments/full-run/check_batch.py full-run-artifacts

      - name: Cache Kokoro weights
        uses: actions/cache@v4
        with:
          path: .hf
          key: kokoro-${{ runner.os }}-v1

      - name: System deps (espeak-ng, ffmpeg)
        run: sudo apt-get update && sudo apt-get install -y espeak-ng ffmpeg

      - name: Install Kokoro
        run: |
          python -m pip install --upgrade pip
          pip install kokoro soundfile numpy

      - name: Render and bundle episodes
        run: |
          python3 tools/tts/bundle_shows.py \
            --transcripts full-run-artifacts/transcripts \
            --out ios/Zwicky/Episodes --require-all-shows

      - name: Upload bundled episodes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundled-episodes
          path: ios/Zwicky/Episodes/
          if-no-files-found: warn
          retention-days: 90

      - name: Publish to R2 and write the feed
        if: env.R2_BUCKET != ''
        run: |
          python -m pip install boto3
          python3 tools/publish_feed.py --episodes ios/Zwicky/Episodes
