name: ios-testflight

on:
  workflow_dispatch:
    inputs:
      changelog:
        description: Internal TestFlight release notes
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  upload:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 60
    environment: testflight
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
      APPLE_DISTRIBUTION_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
      APPLE_DISTRIBUTION_P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
      APP_STORE_PROFILE_BASE64: ${{ secrets.APP_STORE_PROFILE_BASE64 }}
      TESTFLIGHT_CHANGELOG: ${{ inputs.changelog }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Install release tools
        run: |
          brew install xcodegen
          gem install fastlane -v 2.240.1 --no-document
      - name: Run iOS logic checks
        run: ./scripts/run-ios-tests.sh
      - name: Install temporary signing credentials
        shell: bash
        run: |
          set -euo pipefail
          : "${ASC_KEY_ID:?Missing ASC_KEY_ID secret}"
          : "${ASC_ISSUER_ID:?Missing ASC_ISSUER_ID secret}"
          : "${ASC_KEY_P8_BASE64:?Missing ASC_KEY_P8_BASE64 secret}"
          : "${APPLE_DISTRIBUTION_P12_BASE64:?Missing APPLE_DISTRIBUTION_P12_BASE64 secret}"
          : "${APPLE_DISTRIBUTION_P12_PASSWORD:?Missing APPLE_DISTRIBUTION_P12_PASSWORD secret}"
          : "${APP_STORE_PROFILE_BASE64:?Missing APP_STORE_PROFILE_BASE64 secret}"
          umask 077
          key_path="${RUNNER_TEMP}/AuthKey.p8"
          cert_path="${RUNNER_TEMP}/distribution.p12"
          profile_path="${RUNNER_TEMP}/profile.mobileprovision"
          keychain_path="${RUNNER_TEMP}/testflight.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          printf '%s' "$ASC_KEY_P8_BASE64" | base64 -D > "$key_path"
          printf '%s' "$APPLE_DISTRIBUTION_P12_BASE64" | base64 -D > "$cert_path"
          printf '%s' "$APP_STORE_PROFILE_BASE64" | base64 -D > "$profile_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$cert_path" -k "$keychain_path" \
            -P "$APPLE_DISTRIBUTION_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain_path" >/dev/null
          security list-keychains -d user -s "$keychain_path"
          security default-keychain -d user -s "$keychain_path"
          profile_plist="${RUNNER_TEMP}/profile.plist"
          security cms -D -i "$profile_path" > "$profile_plist"
          profile_name="$(/usr/libexec/PlistBuddy -c 'Print Name' "$profile_plist")"
          app_identifier="$(/usr/libexec/PlistBuddy -c 'Print Entitlements:application-identifier' "$profile_plist")"
          [[ "$profile_name" == 'Zwicky App Store' ]] || { echo 'Wrong provisioning profile name' >&2; exit 1; }
          [[ "$app_identifier" == '8K5ZVPCQ42.com.xmevans10.Zwicky' ]] || { echo 'Wrong provisioning profile app identifier' >&2; exit 1; }
          profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print UUID' "$profile_plist")"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$profile_path" "$HOME/Library/MobileDevice/Provisioning Profiles/${profile_uuid}.mobileprovision"
          echo "ASC_KEY_FILE=$key_path" >> "$GITHUB_ENV"
      - name: Build and upload to internal TestFlight
        run: fastlane ios beta
