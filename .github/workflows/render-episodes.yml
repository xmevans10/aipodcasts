name: render-episodes

# Render committed transcripts into app-ready episodes with the free Kokoro cast
# (Apache-2.0, one distinct voice per host; no key, no cloning). Co-hosted shows
# render each validated speaker turn with its own voice. The bundled
# Episodes/ output is uploaded as an artifact to drop into ios/Zwicky/Episodes.
on:
  workflow_dispatch:
    inputs:
      transcripts:
        description: Transcripts directory to render
        default: experiments/full-run/latest/transcripts
  push:
    branches: [main]
    paths:
      - "experiments/full-run/latest/**"
      - "tools/tts/bundle_shows.py"
      - "tools/tts/voice_cast.json"
      - "backend/dialogue.py"
      - "backend/hosts.py"
      - ".github/workflows/render-episodes.yml"

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HF_HOME: ${{ github.workspace }}/.hf
      PYTHONUNBUFFERED: "1"
      # Set these repo secrets to publish the feed + audio to Cloudflare R2; when
      # R2_BUCKET is empty the publish step is skipped and only the artifact is produced.
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}
      R2_PREFIX: v1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Kokoro weights
        uses: actions/cache@v4
        with:
          path: .hf
          key: kokoro-${{ runner.os }}-v1

      - name: System deps (espeak-ng, ffmpeg)
        run: sudo apt-get update && sudo apt-get install -y espeak-ng ffmpeg

      - name: Install Kokoro
        run: |
          python -m pip install --upgrade pip
          pip install kokoro soundfile numpy

      - name: Render and bundle episodes
        run: |
          python3 tools/tts/bundle_shows.py \
            --transcripts "${{ inputs.transcripts || 'experiments/full-run/latest/transcripts' }}" \
            --out build/episodes --require-all-shows

      - name: Upload bundled episodes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundled-episodes
          path: build/episodes/
          if-no-files-found: warn
          retention-days: 90

      - name: Publish to R2 and write the feed
        if: env.R2_BUCKET != ''
        run: |
          python -m pip install boto3
          python3 tools/publish_feed.py --episodes build/episodes
