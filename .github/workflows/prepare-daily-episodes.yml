name: prepare-daily-episodes

# Render after midnight Eastern; publication happens in daily-episodes.yml.
on:
  schedule:
    - cron: "17 2 * * *"
      timezone: "America/New_York"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: prepare-daily-episodes-v1
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      HF_HOME: ${{ github.workspace }}/.hf
      PYTHONUNBUFFERED: "1"
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}
      R2_PREFIX: v1
      GOOGLE_CLOUD_PROJECT: zwicky-509510
      GOOGLE_CLOUD_REGION: eu
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v3
        with:
          project_id: zwicky-509510
          workload_identity_provider: projects/963729700523/locations/global/workloadIdentityPools/github-actions/providers/sciencebreak-main
          service_account: zwicky-406@zwicky-509510.iam.gserviceaccount.com

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install R2 client
        run: python3 -m pip install boto3

      - name: Load release baseline
        run: python3 tools/clear_app_feed.py --baseline-out "$RUNNER_TEMP/release-baseline.json"

      - name: Set Eastern publication date
        run: echo "RELEASE_DATE=$(TZ=America/New_York date +%F)" >> "$GITHUB_ENV"

      - name: Collect reviewed batch history
        run: |
          mkdir -p batches
          baseline=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["minimum_run_id"])' \
            "$RUNNER_TEMP/release-baseline.json")
          gh run list --workflow full-run.yml --status completed --limit 100 \
            --json databaseId,conclusion > completed-runs.json
          jq --argjson baseline "$baseline" -r \
            '[.[] | select(.conclusion == "success" and .databaseId >= $baseline)] | .[].databaseId' \
            completed-runs.json | sort -n > run-ids.txt
          if [ ! -s run-ids.txt ]; then
            echo "No successful full-run batches after baseline $baseline" >&2
            exit 1
          fi
          while IFS= read -r run_id; do
            if ! gh run download "$run_id" --name full-run-transcripts \
                --dir "batches/$run_id"; then
              rm -rf "batches/$run_id"
              echo "Skipping unavailable artifact from run $run_id"
            fi
          done < run-ids.txt

      - name: Select today's two approved episodes
        id: plan
        env:
          LILT_REVIEWER: jev
        run: |
          python3 tools/daily_release.py --batches batches \
            --out daily-transcripts --date "$RELEASE_DATE"
          printf '%s\n' "$RELEASE_DATE" > release-date.txt
          find daily-transcripts -maxdepth 1 -name '*.json' | wc -l | tr -d ' ' > release-count.txt

      - name: Install narration dependencies
        if: steps.plan.outputs.count != '0'
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng ffmpeg
          python3 -m pip install numpy 'google-cloud-texttospeech>=2.31.0'

      - name: Render and measure today's audio
        if: steps.plan.outputs.count != '0'
        run: |
          python3 tools/tts/bundle_shows.py \
            --transcripts daily-transcripts --out daily-episodes \
            --date "$RELEASE_DATE" --tts-provider google-cloud
          python3 tools/tts/estimate_cost.py --episodes daily-episodes \
            --out cost-estimate.json

      - name: Save prepared release
        uses: actions/upload-artifact@v4
        with:
          name: prepared-episodes-${{ env.RELEASE_DATE }}
          path: |
            release-date.txt
            release-count.txt
            daily-transcripts/
            daily-episodes/
            cost-estimate.json
          retention-days: 7
