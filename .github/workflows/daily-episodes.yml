name: daily-episodes

# Stage the release well before 08:00 Eastern; only the feed update waits until 08:00.
on:
  schedule:
    - cron: "17,43 6 * * *"
      timezone: "America/New_York"
    - cron: "13,43 7 * * *"
      timezone: "America/New_York"
    - cron: "13 8 * * *"
      timezone: "America/New_York"
  workflow_run:
    workflows: [prepare-daily-episodes]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: daily-episodes-v1
  cancel-in-progress: false

jobs:
  arm:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    outputs:
      ready: ${{ steps.window.outputs.ready }}
    steps:
      - name: Arm the preparation fallback after 06:00 Eastern
        id: window
        run: |
          python3 - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          ready = (os.environ["GITHUB_EVENT_NAME"] != "workflow_run" or
                   datetime.now(ZoneInfo("America/New_York")).hour >= 6)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"ready={str(ready).lower()}\n")
          PY

  release:
    needs: arm
    if: needs.arm.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}
      R2_PREFIX: v1
      GOOGLE_CLOUD_PROJECT: zwicky-509510
      GOOGLE_CLOUD_REGION: eu
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install R2 client
        run: python3 -m pip install boto3

      - name: Set Eastern publication date
        run: echo "RELEASE_DATE=$(TZ=America/New_York date +%F)" >> "$GITHUB_ENV"

      - name: Check whether today already has two episodes
        id: live
        run: |
          python3 - <<'PY'
          import os, sys
          sys.path.insert(0, "tools")
          from publish_feed import load_existing_feed, r2_client
          feed = load_existing_feed(r2_client(), os.environ["R2_BUCKET"], os.environ["R2_PREFIX"])
          count = sum(story.get("published") == os.environ["RELEASE_DATE"] for story in feed)
          if count > 2:
              raise ValueError(f"Feed already has {count} episodes today")
          print(f"Today's feed count: {count}")
          if count == 2:
              with open(os.environ["GITHUB_OUTPUT"], "a") as output:
                  output.write("released=true\n")
          PY

      - name: Download today's prepared release
        if: steps.live.outputs.released != 'true'
        id: prepared
        run: |
          for run_id in $(gh run list --workflow prepare-daily-episodes.yml \
            --status completed --limit 20 --json databaseId,conclusion \
            --jq '.[] | select(.conclusion == "success") | .databaseId'); do
            if gh run download "$run_id" \
              --name "prepared-episodes-$RELEASE_DATE" --dir prepared; then
              echo 'found=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            rm -rf prepared
          done
          echo 'found=false' >> "$GITHUB_OUTPUT"

      - if: steps.live.outputs.released != 'true' && steps.prepared.outputs.found != 'true'
        uses: google-github-actions/auth@v3
        with:
          project_id: zwicky-509510
          workload_identity_provider: projects/963729700523/locations/global/workloadIdentityPools/github-actions/providers/sciencebreak-main
          service_account: zwicky-406@zwicky-509510.iam.gserviceaccount.com

      - name: Render missing audio as a morning fallback
        if: steps.live.outputs.released != 'true' && steps.prepared.outputs.found != 'true'
        run: bash scripts/prepare-daily-episodes.sh "$RELEASE_DATE" prepared

      - name: Verify prepared files
        if: steps.live.outputs.released != 'true'
        id: ready
        run: |
          test "$(cat prepared/release-date.txt)" = "$RELEASE_DATE"
          count=$(cat prepared/release-count.txt)
          case "$count" in 0|1|2) ;; *) echo "Invalid prepared episode count: $count" >&2; exit 1 ;; esac
          if [ "$count" -gt 0 ]; then
            test "$(find prepared/daily-episodes -maxdepth 1 -name '*.m4a' | wc -l | tr -d ' ')" = "$count"
            test "$(find prepared/daily-episodes -maxdepth 1 -name '*.json' ! -name index.json | wc -l | tr -d ' ')" = "$count"
          fi
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Stage audio, sidecars and listening pages
        if: steps.live.outputs.released != 'true' && steps.ready.outputs.count != '0'
        run: |
          python3 tools/publish_feed.py --episodes prepared/daily-episodes \
            --merge-existing --max-per-day 2 --assets-only

      - name: Wait until 08:00 Eastern
        if: steps.live.outputs.released != 'true' && steps.ready.outputs.count != '0'
        run: |
          python3 - <<'PY'
          from datetime import datetime
          from time import sleep
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo("America/New_York"))
          target = now.replace(hour=8, minute=0, second=0, microsecond=0)
          seconds = max(0, (target - now).total_seconds())
          print(f"Publishing at 08:00 Eastern; waiting {seconds:.0f} seconds", flush=True)
          sleep(seconds)
          PY

      - name: Append to R2 feed
        if: steps.live.outputs.released != 'true' && steps.ready.outputs.count != '0'
        run: |
          python3 tools/publish_feed.py --episodes prepared/daily-episodes \
            --merge-existing --max-per-day 2 --feed-only

      - name: Verify episodes through the app feed URL
        if: steps.live.outputs.released != 'true' && steps.ready.outputs.count != '0'
        run: |
          python3 tools/verify_daily_feed.py \
            --transcripts prepared/daily-transcripts --date "$RELEASE_DATE"
